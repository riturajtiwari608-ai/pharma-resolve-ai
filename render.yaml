services:
  - type: web
    name: pharma-resolve-ai
    env: python
    rootDir: backend
    buildCommand: |
      python --version
      python -m pip --version
      python -m pip install --upgrade pip setuptools wheel
      python -m pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
